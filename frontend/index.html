<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171717'/%3E%3Cpath d='M7 12h15M18.5 8.5 22 12l-3.5 3.5M25 20H10m4.5 3.5L11 20l3.5-3.5' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="实时汇率换算、走势图与 30 种货币行情" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <title>汇率</title>
    <script>
      const params = new URLSearchParams(location.search)
      const t = params.get('theme') ?? localStorage.getItem('fx-theme')
      const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.classList.toggle('dark', dark)
      if (params.get('layout') === 'landscape' || localStorage.getItem('fx-layout') === 'landscape') {
        document.documentElement.classList.add('force-landscape')
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
